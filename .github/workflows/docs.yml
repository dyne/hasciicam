name: docs

on:
  push:
    branches:
      - master
    paths:
      - docs/**
      - CMakeLists.txt
      - CMakePresets.json
      - examples/wasm/**
      - include/**
      - src/**
      - third_party/aalib/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy VitePress site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup Emscripten 4.0.1
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.1

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
        working-directory: ${{ github.workspace }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run build
        env:
          BASE_PATH: /hasciicam/

      - name: Build browser demo
        run: |
          cmake --preset wasm-emscripten
          cmake --build --preset wasm-emscripten --target hasciicam_wasm_sample
          cmake -E copy_directory \
            build/presets/wasm-emscripten/examples/wasm \
            docs/.vitepress/dist/demo
        working-directory: ${{ github.workspace }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
