name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  wasm-browser:
    name: WASM browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Emscripten 4.0.1
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.1

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Record WASM tool versions
        run: |
          emcc --version
          /usr/bin/google-chrome --version

      - name: Restore Emscripten port cache
        uses: actions/cache@v4
        with:
          path: build/presets/wasm-emscripten/.emscripten-cache
          key: wasm-emscripten-4.0.1-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'examples/wasm/CMakeLists.txt') }}

      - name: Configure WASM browser test
        run: >
          cmake --preset wasm-emscripten
          -DHASCIICAM_ENABLE_WASM_BROWSER_TESTS=ON
          -DHASCIICAM_TEST_CHROMIUM=/usr/bin/google-chrome

      - name: Build browser sample
        run: cmake --build --preset wasm-emscripten --target hasciicam_wasm_sample --verbose

      - name: Run Chromium canvas smoke
        run: ctest --output-on-failure --test-dir build/presets/wasm-emscripten -L wasm
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/chromium-config
          XDG_CACHE_HOME: ${{ runner.temp }}/chromium-cache

      - name: Show Chromium smoke diagnostics
        if: ${{ failure() }}
        run: |
          log=build/presets/wasm-emscripten/wasm-chromium-smoke/chromium-lifecycle.log
          if [ -f "$log" ]; then
            echo "::group::Chromium lifecycle log"
            cat "$log"
            echo "::endgroup::"
          fi

      - name: Upload WASM browser artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wasm-browser-artifacts
          path: |
            build/presets/wasm-emscripten/examples/wasm/
            build/presets/wasm-emscripten/wasm-chromium-smoke/
          if-no-files-found: warn

  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            package: linux
            exe_suffix: ""
            cmake_extra: ""
            allow_failure: false
          - name: macOS
            os: macos-latest
            package: mac
            exe_suffix: ""
            cmake_extra: ""
            allow_failure: true
          - name: Windows
            os: windows-latest
            package: win
            exe_suffix: ".exe"
            cmake_extra: "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl"
            allow_failure: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install SDL2 on Linux
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Install SDL2 on macOS
        if: ${{ runner.os == 'macOS' }}
        run: brew install sdl2

      - name: Install SDL2 on Windows
        if: ${{ runner.os == 'Windows' }}
        run: C:/vcpkg/vcpkg.exe install sdl2:x64-windows

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          ${{ matrix.cmake_extra }}
          -DCMAKE_BUILD_TYPE=Release
          -DHASCIICAM_ENABLE_TESTS=ON
          -DHASCIICAM_ENABLE_SDL=ON
          -DHASCIICAM_ENABLE_X11=OFF
          -DHASCIICAM_ENABLE_CURSES=OFF
          -DHASCIICAM_ENABLE_VISUAL_TESTS=ON
          -DHASCIICAM_ENABLE_CAMERA_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --output-on-failure --test-dir build
        env:
          SDL_VIDEODRIVER: dummy
          HASCIICAM_SDL_RENDERER: software
          HASCIICAM_SDL_VSYNC: off

      - name: Setup Node for website package
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build website for release zip
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix docs
          npm run build --prefix docs
        env:
          BASE_PATH: /hasciicam/

      - name: Package release zip
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/hasciicam-${{ matrix.package }}"
          archive="$GITHUB_WORKSPACE/hasciicam-${{ matrix.package }}.zip"
          mkdir -p "${package_dir}/bin" "${package_dir}/share/man/man1" "${package_dir}/share/hasciicam"
          cp "build/hasciicam${{ matrix.exe_suffix }}" "${package_dir}/bin/"
          cp docs/hasciicam.1 "${package_dir}/share/man/man1/"
          cp README.md "${package_dir}/"
          cp -R docs/.vitepress/dist "${package_dir}/share/hasciicam/website"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            find build -maxdepth 1 -name '*.dll' -exec cp '{}' "${package_dir}/bin/" ';'
          fi
          cmake -E chdir "${package_dir}" cmake -E tar cf "${archive}" --format=zip .
          if cmake -E tar tf "${archive}" | grep -Eq '^(dist/|hasciicam-${{ matrix.package }}/)'; then
            echo "release archive still contains a top-level staging directory" >&2
            exit 1
          fi

      - name: Upload release zip
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@v7
        with:
          name: hasciicam-${{ matrix.package }}
          path: hasciicam-${{ matrix.package }}.zip
          if-no-files-found: error

  release:
    name: Release
    needs: [build-and-test, wasm-browser]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build-and-test.result == 'success' && needs.wasm-browser.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download release zips
        uses: actions/download-artifact@v8
        with:
          pattern: hasciicam-*
          path: release-artifacts
          merge-multiple: true

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra_plugins: |
            @semantic-release/changelog
