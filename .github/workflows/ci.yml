name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake -S . -B build -G Ninja -DHASCIICAM_ENABLE_TESTS=ON -DHASCIICAM_ENABLE_SDL=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --output-on-failure --test-dir build
