<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live camera · Hasciicam</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Syne:wght@400;700;800&display=swap');
    :root {
      color-scheme: light;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: #ffeedd;
      color: #251e18;
      --bg: #ffeedd;
      --surface: #fff8f1;
      --surface-soft: #f7e6d8;
      --border: rgba(37, 30, 24, .12);
      --text: #251e18;
      --text-soft: #5f5449;
      --brand: #cb743b;
      --brand-hover: #b96430;
      --tip: #2e8c7d;
      --danger: #9a4a43;
      --shadow: 0 1px 10px rgba(73, 48, 32, .08);
    }
    * { box-sizing: border-box; }
    body {
      background:
        radial-gradient(circle at top left, rgba(203, 116, 59, .12), transparent 28%),
        radial-gradient(circle at top right, rgba(46, 140, 125, .1), transparent 24%),
        var(--bg);
      margin: 0;
      min-height: 100vh;
    }
    a { color: inherit; }
    .site-nav { background: rgba(255, 238, 221, .82); border-bottom: 1px solid var(--border); }
    .site-nav__inner { align-items: center; display: flex; gap: 2rem; justify-content: space-between; margin: 0 auto; max-width: 80rem; min-height: 4rem; padding: 0 1.5rem; }
    .site-title { font-family: "Syne", sans-serif; font-size: 1.25rem; font-weight: 800; letter-spacing: .12em; text-decoration: none; }
    .site-links { display: flex; gap: 1.5rem; }
    .site-links a { color: var(--text-soft); font-family: "Syne", sans-serif; font-size: .9rem; font-weight: 600; text-decoration: none; }
    .site-title:hover, .site-links a:hover { color: var(--brand); }
    main { display: grid; gap: clamp(1.5rem, 4vw, 2.5rem); margin: 0 auto; max-width: 64rem; padding: clamp(2rem, 6vw, 4.5rem) 1.5rem 4rem; }
    header { display: grid; gap: 1rem; }
    h1 { font-family: "Syne", sans-serif; font-size: clamp(2.6rem, 7vw, 4.8rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin: 0; text-wrap: balance; }
    p { color: var(--text-soft); line-height: 1.6; margin: 0; max-width: 65ch; text-wrap: pretty; }
    .demo { background: rgba(255, 248, 241, .84); border: 1px solid var(--border); border-radius: 28px; box-shadow: var(--shadow); display: grid; gap: 1rem; padding: clamp(1rem, 3vw, 1.5rem); }
    .controls { display: flex; flex-wrap: wrap; gap: .75rem; }
    button { border-radius: 999px; box-sizing: border-box; cursor: pointer; font: inherit; font-weight: 700; min-height: 44px; padding: .65rem 1.25rem; }
    button.primary { background: var(--brand); border: 1px solid transparent; color: #fffaf6; box-shadow: var(--shadow); }
    button.primary:hover:not(:disabled) { background: var(--brand-hover); }
    button.secondary { background: rgba(255, 248, 241, .82); border: 1px solid var(--border); color: var(--text); }
    button.secondary:hover:not(:disabled) { border-color: var(--brand); color: var(--brand-hover); }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--tip); outline-offset: 3px; }
    #status { background: rgba(46, 140, 125, .08); border-radius: 12px; color: var(--text); min-height: 1.5rem; padding: .7rem .85rem; }
    #status[data-state="error"] { background: rgba(154, 74, 67, .1); color: var(--danger); }
    #canvas { aspect-ratio: 640 / 477; background: #000; border-radius: 16px; display: block; height: auto; max-width: 100%; width: 100%; }
    .visually-hidden { height: 1px; margin: -1px; overflow: hidden; position: absolute; width: 1px; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 40rem) {
      .site-nav__inner { padding: 0 1rem; }
      .site-links { display: none; }
      main { padding-inline: 1rem; }
      .controls, button { width: 100%; }
      .demo { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Hasciicam">
    <div class="site-nav__inner">
      <a class="site-title" href="../">HASCIICAM</a>
      <div class="site-links">
        <a href="../usage-guide">Usage guide</a>
        <a href="https://github.com/dyne/hasciicam/releases">Downloads</a>
        <a href="https://dyne.org">About Dyne.org</a>
      </div>
    </div>
  </nav>
  <main id="hasciicam-app" data-runtime-ready="false" data-camera-ready="false" data-successful-frames="0" data-sdl-webgl-ready="false" data-canvas-nonblank="false" data-canvas-changed="false" data-presentation-observed="false" data-presentation-count="0" data-canvas-draw-count="0" data-allocation-count="0" data-free-count="0" data-active-render-loops="0" data-max-active-render-loops="0" data-active-streams="0" data-max-active-streams="0" data-shutdown-count="0" data-restart-count="0" data-renderer-backend="none" data-error-kind="none" data-test-complete="false" data-test-passed="false">
    <header>
      <h1>Live ASCII camera</h1>
      <p>Turn your camera into live ASCII art. Every frame stays in this browser tab and is rendered locally with Hasciicam.</p>
    </header>
    <section class="demo" aria-label="Live camera demo">
      <div class="controls" aria-label="Camera controls">
        <button id="start" class="primary" type="button" disabled>Start camera</button>
        <button id="stop" class="secondary" type="button" disabled>Stop camera</button>
      </div>
      <p id="status" role="status" aria-live="polite" data-state="loading">Loading the renderer…</p>
      <canvas id="canvas" width="640" height="477" aria-label="Live ASCII camera output"></canvas>
    </section>
    <video id="camera-video" class="visually-hidden" autoplay muted playsinline></video>
    <canvas id="source-canvas" class="visually-hidden" width="320" height="240" aria-hidden="true"></canvas>
  </main>
  <script src="main.js"></script>
  <script src="hasciicam.js"></script>
</body>
</html>
